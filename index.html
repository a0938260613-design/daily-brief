.co { display: flex; justify-content: space-between; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.kicker { font-size: 12.5px; font-weight: 700; letter-spacing: .14em; color: var(--must-fg); margin: 0 0 8px; }
.right .kicker { color: var(--muted); }

.left .card { border-bottom: 1px solid var(--line); padding: 16px 0; }

  border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; font-size: 15px; font-weight: 800;
  letter-spacing: .02em; color: var(--text); text-transform: none; }
main .kicker:first-child, .sheet .kicker:first-child { margin-top: 6px; }
main .kicker.comp, .calwrap .kicker, .calside .kicker, .offbox .kicker { color: var(--text); border-left-color: var(--must-fg); }
.right .kicker { border-left-color: var(--muted); }

.cols { margin-top: 6px; } .cols > .left, .cols > .right { padding-top: 4px; }

}

.left .card .sum, .left .brief, .left .note { max-width: 52em; }
.cols { grid-template-columns: minmax(0, 1.7fr) minmax(320px, 1fr); }
.wrap { padding-left: 28px; padding-right: 28px; } .bar, .tabs { padding-left: 28px; padding-right: 28px; }

  border: 1px solid var(--line); background: var(--card); box-shadow: 0 2px 10px rgba(0,0,0,.18); }

<script>
"use strict";
const STORE = "pk";
const enc = new TextEncoder(), dec = new TextDecoder();

function b64urlToBytes(text) {

async function fileName(label) {

  const res = await fetch(await fileName(label), { cache: "no-cache" });
  if (!res.ok) throw new Error("missing");
  const blob = new Uint8Array(await res.arrayBuffer());
  if (blob[0] !== 1) throw new Error("format");
  const plain = await crypto.subtle.decrypt(

  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  const data = JSON.parse(dec.decode(await new Response(stream).arrayBuffer()));
  S.cache[label] = data;
  return data;
}

function lock(message) {
  document.getElementById("head").hidden = true;
  clear(main);
  const box = el("div", "center");
  box.append(el("div", null, "🔒"), el("p", null, message || "需要存取金鑰 · Access key required"));
  const input = el("input"); input.type = "password"; input.placeholder = "key"; input.autocomplete = "off";
  const go = el("button", "btn", "OK");
  go.onclick = () => { const v = input.value.trim().replace(/^.*#k=/, ""); if (v) start(v); };
  box.append(input, el("br"), go);
  main.append(box);
}

async function start(keyText) {
  try {
    if (!window.crypto || !crypto.subtle || !window.DecompressionStream) return lock("此瀏覽器版本過舊，無法解密 · Browser too old");
    S.raw = b64urlToBytes(keyText);
    if (S.raw.length !== 32) throw new Error("length");
    S.key = await crypto.subtle.importKey("raw", S.raw, "AES-GCM", false, ["decrypt"]);
    S.cache = {};
    const index = await load("index");
    store(keyText);
    S.uiZh = index.ui; S.uiEn = index.ui_en || null; applyLang(); S.vocab = index.vocab || {}; S.dates = index.dates; S.registry = index.registry || {}; S.roster = index.roster || null; S.hasLaunches = !!index.launches; S.hasApproved = !!index.approved; S.hasReg = !!index.pgreg; S.hasKb = !!index.pgkb;
    document.title = S.ui.title;
    document.getElementById("title").textContent = S.ui.title;
    document.getElementById("head").hidden = false;
    const select = document.getElementById("dates");
    clear(select);
    for (const d of S.dates) {
      const o = el("option", null, d.d + "（" + d.total + (d.must ? "｜" + S.ui.must + " " + d.must : "") + "）");
      o.value = d.d; select.append(o);
    }
    select.onchange = () => openDate(select.value);
    document.getElementById("prev").onclick = () => step(1);
    document.getElementById("next").onclick = () => step(-1);
    if (S.startTab && ["overview", "ALLM", "reg", "competitors", "calendar", "official"].includes(S.startTab)) S.tab = S.startTab;
    const startDate = S.dates.some(d => d.d === S.startDate) ? S.startDate : (S.dates[0] || {}).d;
    if (startDate) await openDate(startDate); else { clear(main); main.append(el("p", "center muted", S.ui.none)); }
  } catch (e) {
    store(null);
    lock("金鑰無效，或內容已更新。請使用最新的連結 · Invalid key");
  }
}
function step(delta) {
  const i = S.dates.findIndex(d => d.d === S.date) + delta;
  if (i >= 0 && i < S.dates.length) openDate(S.dates[i].d);
}
async function openDate(date) {
  S.date = date;
  document.getElementById("dates").value = date;
  const i = S.dates.findIndex(d => d.d === date);
  document.getElementById("prev").disabled = i >= S.dates.length - 1;
  document.getElementById("next").disabled = i <= 0;
  S.day = await load("day:" + date);
  if (S.tab !== "overview" && S.tab !== "ALLM" && S.tab !== "reg" && S.tab !== "competitors" && S.tab !== "calendar" && S.tab !== "official" && S.tab !== "search" &&
      !S.day.groups.some(g => g.code === S.tab)) S.tab = "overview";
  S.topic = null;
  render();
}

const TAB_ICONS = {
  overview: "M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10",
  reg: "M12 3v18M7 21h10M5 7h14M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z",
  ALLM: "M4 5h12v14H6a2 2 0 0 1-2-2zM16 9h3a1 1 0 0 1 1 1v7a2 2 0 0 1-4 0M7 9h6M7 13h6M7 16h4",
  competitors: "M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 7.5a4.5 4.5 0 1 0 0 9a4.5 4.5 0 1 0 0-9M12 11.2a.8.8 0 1 0 0 1.6a.8.8 0 1 0 0-1.6",
  calendar: "M4 6h16v14H4zM4 10h16M8 3v4M16 3v4M8 14h2M14 14h2M8 17h2",
  official: "M9 6h11M9 12h11M9 18h11M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17",
};
function tabIcon(d) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "tico"); s.setAttribute("aria-hidden", "true");
  s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "1.8");

}
function tabs() {
  const bar = document.getElementById("tabs");
  clear(bar);

  if (!sub) { sub = el("div", "tabs sub"); sub.id = "subtabs"; sub.setAttribute("role", "tablist"); bar.after(sub); }

  const isMarket = isNews && S.tab !== "overview";
  if (isNews) S.lastNews = S.tab;
  if (isMarket) S.lastMarket = S.tab;
  const go = id => { S.tab = id; S.topic = null; S.company = null; S.coView = null; S.offType = null; S.nf = {}; S.kbView = null; render(); window.scrollTo(0, 0); };
  const add = (target, id, label, count, dot, selected) => {
    const b = el("button", "tab");

  add(bar, "calendar", S.ui.calTab);

function noteP(cls, text) {
  const p = el("p", cls);

  while ((m = rest.match(/\[\[(\w+)\|([^\]]+)\]\]/))) {

}

  openSheet(S.ui.help, body => {
