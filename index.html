.co { display: flex; justify-content: space-between; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.kicker { font-size: 12.5px; font-weight: 700; letter-spacing: .14em; color: var(--must-fg); margin: 0 0 8px; }
.right .kicker { color: var(--muted); }

.left .card { border-bottom: 1px solid var(--line); padding: 16px 0; }

  border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; font-size: 15px; font-weight: 800;
  letter-spacing: .02em; color: var(--text); text-transform: none; }
main .kicker:first-child, .sheet .kicker:first-child { margin-top: 6px; }
main .kicker.comp, .calwrap .kicker, .calside .kicker, .offbox .kicker { color: var(--text); border-left-color: var(--must-fg); }
.right .kicker { border-left-color: var(--muted); }

.cols { margin-top: 6px; } .cols > .left, .cols > .right { padding-top: 4px; }

}

.left .card .sum, .left .brief, .left .note { max-width: 52em; }
.cols { grid-template-columns: minmax(0, 1.7fr) minmax(320px, 1fr); }
.wrap { padding-left: 28px; padding-right: 28px; } .bar, .tabs { padding-left: 28px; padding-right: 28px; }

  border: 1px solid var(--line); background: var(--card); box-shadow: 0 2px 10px rgba(0,0,0,.18); }

function el(tag, cls, text) {
  const node = document.createElement(tag);

  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function b64urlToBytes(text) {
  const pad = text.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - text.length % 4) % 4);
  const bin = atob(pad);
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}
function store(value) { try { value ? localStorage.setItem(STORE, value) : localStorage.removeItem(STORE); } catch (e) {} }

async function fileName(label) {

  const buf = new Uint8Array(S.raw.length + tail.length);
  buf.set(S.raw); buf.set(tail, S.raw.length);
  const hash = new Uint8Array(await crypto.subtle.digest("SHA-256", buf));
  return Array.from(hash.slice(0, 10), b => b.toString(16).padStart(2, "0")).join("") + ".bin";
}
async function load(label) {
  if (S.cache[label]) return S.cache[label];
  const res = await fetch(await fileName(label), { cache: "no-cache" });
  if (!res.ok) throw new Error("missing");
  const blob = new Uint8Array(await res.arrayBuffer());
  if (blob[0] !== 1) throw new Error("format");
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: blob.slice(1, 13), additionalData: enc.encode(label) }, S.key, blob.slice(13));
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  const data = JSON.parse(dec.decode(await new Response(stream).arrayBuffer()));
  S.cache[label] = data;
  return data;
}

function matches(a, q) {
  const hay = [a.title, a.title_orig, a.summary, a.region, a.topic, a.source, (a.actors || []).map(x => x.name).join(" ")].join(" ").toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w));
}
function viewSearch() {
  const box = el("div", "search");
  const input = el("input"); input.type = "search"; input.placeholder = S.ui.searchHint; input.value = S.query || "";
  box.append(input); main.append(box);
  const bar = el("div", "filters"); bar.append(el("span", "idlabel", S.ui.fPeriod));
  main.append(bar);
  const out = el("div", "left flat tl"); main.append(out);
  let runId = 0;
  const run = async () => {
    const mine = ++runId;
    S.query = input.value; clear(out);
    const q = input.value.trim().toLowerCase(); if (!q) return;
    const range = S.searchRange || 7;
    const startAt = S.dates.findIndex(d => d.d === S.date);
    const days = S.dates.slice(startAt, startAt + range).map(d => d.d);
    const note = el("p", "nomatch", ""); out.append(note);
    let total = 0;
    for (const date of days) {
      const day = date === S.date ? S.day : await load("day:" + date);
      if (mine !== runId) return;
      const hits = mergeEvents(allArticles(day).filter(a => matches(a, q)));
      if (!hits.length) continue;
      total += hits.length;
      const h = el("h2", "dayhead", dayLabel(date)); h.append(el("span", "muted", hits.length + " " + S.ui.unit)); out.append(h);
      limited(out, hits, 30, a => card(a, true));
    }
    note.textContent = total ? total + " " + S.ui.results : S.ui.notFound;
  };
  const range = S.searchRange || 7;
  for (const [n, label] of [[1, S.ui.r1], [7, S.ui.r7], [30, S.ui.r30]]) {
    const c = el("button", "chip", label); c.setAttribute("aria-pressed", String(range === n));
    c.onclick = () => { S.searchRange = n; for (const x of bar.querySelectorAll(".chip")) x.setAttribute("aria-pressed", String(x === c)); run(); };
    bar.append(c);
  }
  let timer = null;
  input.oninput = () => { clearTimeout(timer); timer = setTimeout(run, 200); };

}
function navState() { return { nav: 1, tab: S.tab, date: S.date, company: S.company || null, coView: S.coView || null, offView: S.offView || null }; }
function recordNav() {

function foldFacets() {
  const active = !!main.querySelector(".clearbar:not([hidden])");
  for (const side of main.querySelectorAll("aside.facets")) {
    let b = side.previousElementSibling;
    if (!b || !b.classList.contains("ffold")) {
      b = el("button", "ffold", S.ui.fFilters);
      b.onclick = () => { S.facetOpen = !S.facetOpen; foldFacets(); };
      side.before(b);
    }
    if (side.classList.contains("open") !== !!S.facetOpen) side.classList.toggle("open", !!S.facetOpen);
    if (b.classList.contains("on") !== !!S.facetOpen) b.classList.toggle("on", !!S.facetOpen);
    if (b.classList.contains("active") !== active) b.classList.toggle("active", active);
  }
}

(function () {
